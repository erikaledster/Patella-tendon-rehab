function painAdvice(x){
 const vals=[x.pb,x.pd,x.pa,x.nm].map(Number).filter(v=>!Number.isNaN(v));
 if(!vals.length)return `<div class="notice">Log pain and next-morning response after the session to guide your next load.</div>`;
 const during=Number(x.pd||0), next=Number(x.nm||0), before=Number(x.pb||0);
 if(during>=6 || next>=6)return `<div class="danger card"><b>High symptom response.</b><br>Reduce/stop the provoking load and check in with your physio. Don't progress this session.</div>`;
 if(during>=4 || next>before+2)return `<div class="warning card"><b>Load may be too high.</b><br>Keep the next session easier or reduce volume/load, and use the next-morning response to decide whether to progress.</div>`;
 return `<div class="good card"><b>Response looks stable.</b><br>Continue the planned load if your physio is happy and symptoms stay around baseline the next morning.</div>`;
}
function metrics(k){
 const x=state[k]||{};
 const slider=(label,key,val,step="0.5")=>`<div class="metric sliderMetric"><div class="sliderHead"><label>${label}</label><b id="${k}-${key}-out">${val??0}/10</b></div><input type="range" min="0" max="10" step="${step}" value="${val??0}" oninput="document.getElementById('${k}-${key}-out').textContent=this.value+'/10';setv('${k}','${key}',this.value)"></div>`;
 return `<div class="metrics">
 ${slider('Pain before /10','pb',x.pb)}
 ${slider('Pain during /10','pd',x.pd)}
 ${slider('RPE /10','rpe',x.rpe,'0.5')}
 ${slider('Pain after /10','pa',x.pa)}
 ${slider('Next morning /10','nm',x.nm)}
 </div><textarea class="notes" rows="2" placeholder="Notes: load used, knee response, confidence, anything unusual..." onchange="setv('${k}','notes',this.value)">${x.notes??''}</textarea>`;
}
function sessionCard(k,title,subtitle,items){
 const x=state[k]||{};let done=0;
 let body=`<section class="card"><div class="row"><div style="flex:1"><h2>${title}</h2><div class="muted">${subtitle||""}</div></div><span class="tag">SESSION</span></div>`;
 items.forEach((e,j)=>{if(isChecked(k,j))done++;body+=`<div class="exercise"><div class="row"><input type="checkbox" ${isChecked(k,j)?'checked':''} onchange="toggle('${k}',${j},this.checked)"><div class="ename">${e[0]}</div></div><div class="dose">${e[1]} • Rest ${e[2]}</div></div>`});
 body+=`<div class="progressrow"><span>${done}/${items.length} completed</span><span>${items.length?Math.round(done/items.length*100):0}%</span></div><div class="bar"><i style="width:${items.length?done/items.length*100:0}%"></i></div>`;
 body+=`<details><summary style="font-weight:700;margin:12px 0">Log session</summary>${metrics(k)}</details>`;
 body+=`</section>`;return body;
}

 let body=`<section class="card"><h2>Start here</h2><div class="notice"><b>Your proper 5-week rehab starts Monday 28 September.</b><br>These two short sessions bridge the gap so you don't have to do nothing until Monday.</div>
<p class="muted">Because you reported current pain around 4–5/10 and your physio asked for a running break, these bridge sessions are deliberately low-impact. No running or jumping.</p></section>`;
 Object.entries(bridge).forEach(([title,items],i)=>body+=sessionCard("bridge"+i,title,"Complete once before Monday.",items));
 body+=`<section class="card"><h3>How to use pain/load tracking</h3><ul class="checklist"><li>Log pain before, during, after and the next morning.</li><li>Use RPE to describe how hard the session felt.</li><li>Progress only when the knee is tolerating the current load and your physio is happy.</li><li>For later running/sprinting, use the staged return rather than jumping straight back to rugby.</li></ul></section>
 <section class="card"><h3>Rest timer</h3><div class="timer" id="timer">1:30</div><div class="timerBtns"><button class="smallbtn" onclick="startTimer(60)">60 sec</button><button class="smallbtn" onclick="startTimer(90)">90 sec</button><button class="smallbtn" onclick="startTimer(120)">2 min</button><button class="smallbtn" onclick="stopTimer()">Stop</button></div></section>`;
 return body;
}
function weekDate(w){
 if(String(w)==="0.5") return "23–27 Sep";
 let d=new Date(homeStart+"T00:00:00");d.setDate(d.getDate()+(Number(w)-1)*7);
 return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})
}
function renderWeek(){
 const w=weeks[currentWeek];
 let body=`<section class="card"><h2>Weeks 1–6</h2><p class="muted" style="margin-top:-4px">Extra Week 0.5 bridge session is shown first.</p><div class="weekTabs">${["0.5",1,2,3,4,5,6].map(n=>`<button class="${String(currentWeek)===String(n)?"active":""}" onclick="currentWeek='${n}';localStorage.setItem('rehabWeek','${n}');render()">Week ${n}</button>`).join("")}</div></section>`;
 body+=`<section class="card"><div class="row"><div style="flex:1"><h2>Week ${currentWeek} — ${w.goal}</h2><div class="muted">Starts ${weekDate(currentWeek)}</div></div><span class="tag">${currentWeek==="0.5"?"BRIDGE":(w.gym?"GYM":"HOME")}</span></div>`;
 if(currentWeek==="0.5") body+=`<div class="notice"><b>Bridge week:</b> complete the Wednesday 23 September and Friday 25 September sessions here before Week 1 starts Monday 28 September. Keep these sessions low-impact.</div>`;
 if(currentWeek<5 && currentWeek!=="0.5")body+=`<div class="notice">No running in weeks 1–4, following your physio's advice.</div>`;
 if(currentWeek===5)body+=`<div class="notice"><b>Monday is your progress-testing session.</b> Running starts here only if your physio clears it after the testing and symptom response review.</div>`;
 if(currentWeek===6)body+=`<div class="notice"><b>Gym Week 6:</b> strength-building continues. Running is a separate, graded exposure and should only be done if Week 5 was tolerated and your physio is happy.</div>`;
 body+=`<div class="weekTimer"><h3>Rest timer</h3><div class="timer" id="weekTimer">1:30</div><div class="timerBtns"><button class="smallbtn" onclick="startWeekTimer(60)">60 sec</button><button class="smallbtn" onclick="startWeekTimer(90)">90 sec</button><button class="smallbtn" onclick="startWeekTimer(120)">2 min</button><button class="smallbtn" onclick="stopWeekTimer()">Stop</button></div></div></section>`;
 w.days.forEach((d,i)=>{
   const k=dayKey("w"+currentWeek,i);
   if(!d[2].length) body+=`<section class="card"><h2>${d[0]}</h2><div class="muted">${d[1]}</div><p class="muted">Rest day.</p></section>`;
   else if(["Tuesday","Thursday","Saturday"].includes(String(d[0]).split(" ")[0]) && /recovery|mobility/i.test(d[1])) {
     const walk=d[2].find(x=>/walk|bike/i.test(x[0]));
     const items=[];
     if(walk) items.push(walk);
     mobilityRoutine.forEach(m=>items.push(m));
     body+=sessionCard(k,d[0],"Mobility / recovery — complete this routine on Tuesday, Thursday and Saturday.",items);
   } else body+=sessionCard(k,d[0],d[1],d[2]);
   if(String(d[0]).startsWith("Saturday") && currentWeek===4) body+=`<section class="card"><h3>Post-test mobility</h3><p class="muted">After the Week 4 checkpoint, complete the mobility routine if symptoms are settled.</p>${mobilityRoutine.map(m=>`<div class="exercise"><div class="row"><div class="ename">${m[0]}</div></div><div class="dose">${m[1]} • ${m[2]}</div></div>`).join("")}</section>`;
 });
 if(currentWeek===4)body+=`<section class="card"><h3>Week 4 checkpoint</h3><p class="muted">Aim for controlled single-leg work without obvious favouring and no significant next-morning flare.</p></section>`;
 if(currentWeek===5)body+=`<section class="card warning"><h3>Week 5 checkpoint</h3><p class="muted">Review resting pain, strength tolerance, hopping tolerance and next-morning response with your physio before progressing into running.</p></section>`;
 if(currentWeek===6)body+=`<section class="card"><h3>Gym progression rule</h3><p class="muted">If all sets are controlled and symptoms remain stable, add a small amount of weight next time (for example 2.5–5%) rather than lots of extra volume. If symptoms flare, hold or reduce the load.</p></section>`;
 body+=`<section class="card"><div class="row"><button class="smallbtn" onclick="changeWeek(-1)">← Previous</button><button class="smallbtn" onclick="changeWeek(1)">Next →</button></div></section>`;
 return body;
}
function changeWeek(n){
 const order=["0.5",1,2,3,4,5,6],idx=order.indexOf(String(currentWeek));
 currentWeek=order[Math.max(0,Math.min(order.length-1,idx+n))];
 localStorage.setItem("rehabWeek",currentWeek);render()
}
function renderRunning(){
 let weekList=[5,6,7,8,9,10,11,12];
 let rw=Number(state.runningWeek||5);
 if(!weekList.includes(rw))rw=5;
 let body=`<section class="card"><h2>Running</h2><p class="muted" style="margin-top:-4px">Running starts from Week 5. Each week is set out like your Weeks 1–6 plan, with Monday and Friday as the running sessions.</p><div class="warning notice"><b>Do not treat these stages as automatic clearance.</b><br>Your physio's advice comes first. Progress gradually: running → acceleration → speed → change of direction → rugby conditioning → team training.</div>
 <div class="weekTabs" id="runWeekTabs">${weekList.map(w=>`<button class="${w===rw?'active':''}" onclick="setRunningWeek(${w})">Week ${w}</button>`).join('')}</div></section>`;
 let items=running.filter(r=>r.week===rw);
 body+=`<section class="card"><div class="row"><div style="flex:1"><h2>Week ${rw}</h2><div class="muted">Monday → running/sprint progression • Friday → second running/sprint exposure</div></div><span class="tag">RUNNING</span></div></section>`;
 items.forEach((r,i)=>{
   let globalIndex=running.indexOf(r); const k="run"+globalIndex, x=state[k]||{};
   body+=`<section class="card"><div class="row"><div style="flex:1"><h2>${r.day}</h2><div class="muted">${r.stage} — ${r.title}</div></div><span class="tag">${r.day==='Monday'?'SESSION 1':'SESSION 2'}</span></div>
   <div class="exercise"><div class="row"><input type="checkbox" ${x.done?'checked':''} onchange="setv('${k}','done',this.checked);render()"><div class="ename">Complete ${r.stage}</div></div>
   ${(() => {
     const parts = r.session.split(/\s+(?=Main:|Cool-down:)/);
     const warm = parts[0].replace(/^Warm-up:\s*/, '').trim();
     const mainPart = parts.find(p => p.startsWith('Main:'));
     const coolPart = parts.find(p => p.startsWith('Cool-down:'));
     const main = mainPart ? mainPart.replace(/^Main:\s*/, '').trim() : '';
     const cool = coolPart ? coolPart.replace(/^Cool-down:\s*/, '').trim() : '';
     return `<div class="runBlock"><div class="runBlockTitle">WARM-UP</div><div class="runBlockText">${warm}</div></div>
       <div class="runBlock"><div class="runBlockTitle">MAIN SESSION</div><div class="runBlockText">${main}</div></div>
       <div class="runBlock"><div class="runBlockTitle">COOL-DOWN</div><div class="runBlockText">${cool}</div></div>`;
   })()}
   <p class="muted"><b>Progression note:</b> ${r.note}</p>
   <details><summary style="font-weight:700">Log response</summary>${metrics(k)}</details></div></section>`;
 });
 let done=items.filter(r=>state["run"+running.indexOf(r)]?.done).length;
 body+=`<section class="card"><h3>Week ${rw} progress</h3><div class="progressrow"><span>${done} of ${items.length} sessions completed</span><b>${Math.round(done/items.length*100)}%</b></div><div class="bar"><i style="width:${Math.round(done/items.length*100)}%"></i></div></section>`;
 body+=`<section class="card"><h3>Running progression</h3><ol class="checklist"><li>Weeks 5–6: run/walk re-entry and build duration</li><li>Week 7: continuous easy running</li><li>Weeks 8–9: acceleration and controlled speed exposure</li><li>Weeks 10–11: deceleration, change of direction and conditioning</li><li>Week 12: modified rugby-specific running and return toward team training</li></ol></section>`;
 return body;
}
function setRunningWeek(w){state.runningWeek=w;save();render();}
function renderDashboard(){
 let sessions=0,checked=0,total=0;let painData=[];
 for(let w=1;w<=6;w++){let wt=weeks[w];let wd=0,wtot=0;
   wt.days.forEach((d,i)=>{if(!d[2].length)return;const k=dayKey("w"+w,i),x=state[k]||{};d[2].forEach((_,j)=>{wtot++;if(x["e"+j]){checked++;wd++;}});if(x.pb!==undefined){sessions++;painData.push([sessions,Number(x.pb)||0,Number(x.nm)||null])}});
   bodyDummy=0;
 }
 let runDone=running.filter((_,i)=>state["run"+i]?.done).length;
 const overall=totalProgress();
 const today=new Date();
 const dow=today.toLocaleDateString('en-GB',{weekday:'long'});
 const diffDays=Math.floor((today-new Date("2026-09-23T00:00:00"))/86400000); const weekToday=diffDays<5?"0.5":Math.min(6,Math.max(1,Math.floor((today-new Date(homeStart+"T00:00:00"))/86400000/7)+1));
 const wp=weekProgress(weekToday);
 return `<section class="card"><h2>Dashboard</h2><div class="grid2">
 <div class="stat"><small>Exercises checked</small><br><b>${overall.done}</b><br><small>of ${overall.total}</small></div>
 <div class="stat"><small>Running stages</small><br><b>${runDone}</b><br><small>of ${running.length}</small></div>
 </div></section>
 <section class="card"><h3>This week</h3><div class="grid2"><div class="stat"><small>Week</small><br><b>${weekToday}</b><br><small>${weeks[weekToday].goal}</small></div><div class="stat"><small>Exercises</small><br><b>${wp.done}/${wp.total}</b><br><small>completed</small></div></div><div class="progressrow"><span>${dow}</span><span>${Math.round((wp.total?wp.done/wp.total:0)*100)}%</span></div><div class="bar"><i style="width:${wp.total?wp.done/wp.total*100:0}%"></i></div><button class="primary" style="margin-top:10px" onclick="currentWeek=${weekToday};localStorage.setItem('rehabWeek',${weekToday});setPage('week')">Open this week's plan</button></section>
 <section class="card"><h3>Weeks 1–6 completion</h3>${["0.5",1,2,3,4,5,6].map(w=>{const p=weekProgress(w);return `<div class="progressrow"><span>Week ${w}</span><span>${p.done}/${p.total}</span></div><div class="bar"><i style="width:${p.total?p.done/p.total*100:0}%"></i></div>`}).join("")}</section>
 <section class="card"><h3>Pain trend</h3><p class="muted">Logged session pain before vs next morning. Empty charts simply mean you haven't logged enough sessions yet.</p><canvas id="painChart" width="700" height="190"></canvas></section>
 <section class="card"><h3>Load / RPE trend</h3><p class="muted">Session RPE from your logged rehab sessions.</p><canvas id="rpeChart" width="700" height="190"></canvas></section>
 <section class="card"><h3>Week 0.5 — bridge sessions</h3><p class="muted">Today: Wednesday 23 September. Second session: Friday 25 September. Week 1 starts Monday 28 September.</p><button class="primary" onclick="currentWeek='0.5';localStorage.setItem('rehabWeek','0.5');setPage('week')">Open Week 0.5</button></section>
 <section class="card"><h3>Quick guidance</h3><p class="muted">Use the next-morning response as one of your main load checks. A graded, criterion-based return to sport is preferable to a sudden jump from rehab to full training.</p></section>`;
}
function weekProgress(w){let done=0,total=0;weeks[w].days.forEach((d,i)=>{if(!d[2].length)return;const x=state[dayKey("w"+w,i)]||{};d[2].forEach((_,j)=>{total++;if(x["e"+j])done++})});return{done,total}}
function totalProgress(){let done=0,total=0;for(const w of ["0.5",1,2,3,4,5,6]){const p=weekProgress(w);done+=p.done;total+=p.total}return{done,total}}
function drawDashboardIfNeeded(){if(page==="dashboard"){setTimeout(drawCharts,20)}}
function chart(canvasId,values1,values2,label1,label2){
 const c=document.getElementById(canvasId);if(!c)return;const ctx=c.getContext("2d"),W=c.width,H=c.height;
 ctx.clearRect(0,0,W,H);ctx.strokeStyle="#d1d5db";ctx.fillStyle="#667085";ctx.font="12px -apple-system";ctx.beginPath();ctx.moveTo(45,15);ctx.lineTo(45,H-30);ctx.lineTo(W-10,H-30);ctx.stroke();
 const vals=[...values1,...values2].filter(v=>typeof v==="number"&&!Number.isNaN(v));if(!vals.length){ctx.fillText("No logged data yet",W/2-45,H/2);return}
 const max=Math.max(10,...vals),min=0;function pts(a){return a.map((v,i)=>{const x=50+(i/(Math.max(a.length-1,1)))*(W-70);const y=H-30-((v-min)/(max-min))*(H-50);return[x,y]})}
 function line(a){const p=pts(a);if(!p.length)return;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();p.forEach(q=>{ctx.beginPath();ctx.arc(q[0],q[1],3,0,Math.PI*2);ctx.fill()})}
 ctx.strokeStyle="#2563eb";ctx.fillStyle="#2563eb";line(values1);ctx.strokeStyle="#7c3aed";ctx.fillStyle="#7c3aed";line(values2);
 ctx.fillStyle="#667085";ctx.fillText(label1,55,14);ctx.fillText(label2,160,14);
}
function drawCharts(){
 const entries=[];
 for(const k of allSessionKeys()){const x=state[k];if(/^w[1-6]-/.test(k)&&x.pb!==undefined)entries.push(x)}
 const before=entries.map(x=>Number(x.pb)).filter(v=>!Number.isNaN(v)),next=entries.map(x=>x.nm!==undefined?Number(x.nm):null).filter(v=>!Number.isNaN(v));
 const rpe=entries.map(x=>Number(x.rpe)).filter(v=>!Number.isNaN(v));
 chart("painChart",before,next,"Before","Next morning");
 chart("rpeChart",rpe,[],"RPE","");
}
function renderTests(){
 let body=`<section class="card"><h2>Return-to-rugby testing</h2><div class="notice">These are tracking benchmarks, not medical clearance. Compare right/left where possible and review the results with your physio before full training or competition.</div>`;
 rugbyTests.forEach((t,i)=>{const k="test"+i,x=state[k]||{};body+=`<section class="exercise"><div class="row"><input type="checkbox" ${x.done?'checked':''} onchange="setv('${k}','done',this.checked);render()"><div class="ename">${t[0]}</div></div><div class="dose"><b>Target:</b> ${t[1]}<br><b>Look for:</b> ${t[2]}</div><div class="inputs"><label>Right pain<input inputmode="decimal" value="${x.rp??''}" onchange="setv('${k}','rp',this.value)"></label><label>Left pain<input inputmode="decimal" value="${x.lp??''}" onchange="setv('${k}','lp',this.value)"></label><label>Right reps/time<input value="${x.rr??''}" onchange="setv('${k}','rr',this.value)"></label><label>Left reps/time<input value="${x.lr??''}" onchange="setv('${k}','lr',this.value)"></label></div></section>`});
 body+=`</section><section class="card"><h3>Rugby return sequence</h3><ol class="checklist"><li>Strength and symptom tolerance</li><li>Easy running</li><li>Acceleration and speed exposure</li><li>Change of direction and deceleration</li><li>Rugby conditioning and ball work</li><li>Modified team training</li><li>Full training/contact</li><li>Match minutes → normal performance</li></ol></section>`;
 return body;
}
function startTimer(sec){stopTimer();timerSeconds=sec;updateTimer();timerInterval=setInterval(()=>{timerSeconds--;updateTimer();if(timerSeconds<=0){stopTimer();navigator.vibrate?.([150,80,150]);}},1000)}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
function updateTimer(){const el=document.getElementById("timer");if(el)el.textContent=`${Math.floor(timerSeconds/60)}:${String(timerSeconds%60).padStart(2,"0")}`}
function startWeekTimer(sec){stopWeekTimer();weekTimerSeconds=sec;updateWeekTimer();weekTimerInterval=setInterval(()=>{weekTimerSeconds--;updateWeekTimer();if(weekTimerSeconds<=0){stopWeekTimer();navigator.vibrate?.([150,80,150]);}},1000)}
function stopWeekTimer(){if(weekTimerInterval){clearInterval(weekTimerInterval);weekTimerInterval=null}}
function updateWeekTimer(){const el=document.getElementById("weekTimer");if(el)el.textContent=`${Math.floor(weekTimerSeconds/60)}:${String(weekTimerSeconds%60).padStart(2,"0")}`}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").then(r=>r.update()).catch(()=>{})}
</script>
</body></html>
